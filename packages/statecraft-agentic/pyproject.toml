[project]
name = "statecraft-agentic"
version = "0.3.1"
description = "Model-driven agents for statecraft: the agentic loop as states, models as tools, skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["statecraft>=0.3,<0.4", "httpx>=0.27", "pyyaml>=6.0", "jsonschema>=4.20"]

[project.entry-points."statecraft.plugins"]
agentic = "statecraft_agentic.plugin:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statecraft_agentic*"]
