[project]
name = "statecraft-opensandbox"
version = "0.1.0"
description = "Shell commands in OpenSandbox sandboxes as a durable statecraft effect"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["statecraft", "httpx>=0.27"]

[project.entry-points."statecraft.plugins"]
opensandbox = "statecraft_opensandbox.plugin:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statecraft_opensandbox*"]
