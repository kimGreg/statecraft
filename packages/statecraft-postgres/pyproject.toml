[project]
name = "statecraft-postgres"
version = "0.3.0"
description = "The statecraft state store on PostgreSQL: executors on several hosts, one database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["statecraft>=0.3,<0.4", "psycopg[binary]>=3.1"]

[project.entry-points."statecraft.stores"]
postgres = "statecraft_postgres.store:from_config"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statecraft_postgres*"]
