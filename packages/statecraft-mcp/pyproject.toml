[project]
name = "statecraft-mcp"
version = "0.3.0"
description = "MCP servers as statecraft tool providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["statecraft>=0.3,<0.4", "mcp>=1.20"]

[project.entry-points."statecraft.plugins"]
mcp = "statecraft_mcp.provider:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statecraft_mcp*"]
