[project]
name = "statecraft-coding"
version = "0.1.0"
description = "A coding agent on statecraft's agentic harness, with a durable terminal session"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["statecraft", "statecraft-agentic"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statecraft_coding*"]
