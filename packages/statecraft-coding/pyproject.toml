[project]
name = "statecraft-coding"
version = "0.3.1"
description = "A coding agent on statecraft's agentic harness, with a durable terminal session"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["statecraft>=0.3,<0.4", "statecraft-agentic>=0.3,<0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statecraft_coding*"]
