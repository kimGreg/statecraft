[project]
name = "statecraft-console"
version = "0.2.0"
description = "The statecraft console: registry, graphs, providers and live runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["statecraft", "starlette>=0.37", "uvicorn>=0.29"]

[project.scripts]
statecraft-console = "statecraft_console.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statecraft_console*"]

[tool.setuptools.package-data]
"statecraft_console" = ["static/*"]
