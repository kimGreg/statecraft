[project]
name = "statecraft"
version = "0.1.0"
description = "A durable state machine executor for agents: agents as state machines, a fenced state store, model-driven agents as states"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# the decider checks answers against a full JSON Schema (without it: type and enum only)
schema = ["jsonschema>=4.20"]
# the web console (`python -m statecraft.console`)
console = ["starlette>=0.37", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.20", "starlette>=0.37", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statecraft*"]

[tool.setuptools.package-data]
"statecraft.console" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::pydantic.json_schema.PydanticJsonSchemaWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
