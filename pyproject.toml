[project]
name = "statecraft"
version = "0.2.0"
description = "A durable execution runtime for composable agents: state machines, effects, recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.20",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# the runtime served over HTTP (`statecraft serve`)
server = ["starlette>=0.37", "uvicorn>=0.29"]
# spans per step and effect call through the OpenTelemetry API (the application configures an SDK)
otel = ["opentelemetry-api>=1.20"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "starlette>=0.37",
  "uvicorn>=0.29",
]

[project.scripts]
statecraft = "statecraft.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statecraft*"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/statecraft-agentic/tests", "packages/statecraft-mcp/tests",
             "packages/statecraft-console/tests", "packages/statecraft-opensandbox/tests",
             "packages/statecraft-postgres/tests", "packages/statecraft-coding/tests",
             "examples"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120  # a test that hangs fails (a lease never released, an unbounded retry)
filterwarnings = ["ignore::pydantic.json_schema.PydanticJsonSchemaWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# the chaos harness is a long-running script kept as the audit wrote it
extend-exclude = ["chaos"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
